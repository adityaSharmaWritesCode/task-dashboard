<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Themes ── */
  :root, [data-theme="dark"] {
    --bg:           #0f1117;
    --surface:      #161b22;
    --surface2:     #102128;
    --input-bg:     #0d1117;
    --border:       #21262d;
    --border2:      #30363d;
    --text:         #cdd9e5;
    --text-head:    #f0fefe;
    --text-muted:   #86949e;
    --text-faint:   #6e7681;
    --text-dim:     #484f58;
    --accent:       #58a6ff;
    --accent2:      #388bfd;
    --sub-bg:       #1f2d3d;
    --hover-bg:     #1a2332;
    --shadow:       rgba(0,0,0,0.5);
    --dl-fut:       #58a6ff;
    --dl-soon-bg:   #3d2a00;
    --dl-soon:      #ffa657;
    --dl-over-bg:   #3d0000;
    --dl-over:      #f78166;
    --success:      #3fb950;
  }

  [data-theme="light"] {
    --bg:           #f6f8fa;
    --surface:      #ffffff;
    --surface2:     #f0f2f6;
    --input-bg:     #ffffff;
    --border:       #d0d7de;
    --border2:      #b1bac4;
    --text:         #24292f;
    --text-head:    #1a1f24;
    --text-muted:   #576068;
    --text-faint:   #607781;
    --text-dim:     #a0aab4;
    --accent:       #0969da;
    --accent2:      #0550ae;
    --sub-bg:       #ddf4ff;
    --hover-bg:     #f3f8ff;
    --shadow:       rgba(0,0,0,0.08);
    --dl-fut:       #0969da;
    --dl-soon-bg:   #fff8c5;
    --dl-soon:      #9a6700;
    --dl-over-bg:   #ffebe9;
    --dl-over:      #cf222e;
    --success:      #1a7f37;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    transition: background 0.25s;
  }

  /* ── Top Bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 54px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 12px;
    transition: background 0.25s;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .hamburger {
    display: none;
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text);
    font-size: 1.2rem;
    padding: 0;
    align-items: center;
    justify-content: center;
  }
  .topbar-brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--text-head);
  }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 34px;
    height: 34px;
    border: 1px solid var(--border2);
    background: transparent;
    border-radius: 7px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.9rem;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Main Layout ── */
  .main {
    display: grid;
    grid-template-columns: 260px 1fr 380px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* ── Left Sidebar ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 0;
    transition: background 0.25s;
  }
  .sidebar-section { padding: 0 16px; margin-bottom: 20px; }
  .sidebar-title {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: 8px;
    padding: 0 8px;
  }
  .sidebar-item {
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-item:hover { background: var(--hover-bg); color: var(--accent); }
  .sidebar-item.active { background: var(--sub-bg); color: var(--accent); font-weight: 600; }
  .sidebar-icon { font-size: 0.8rem; width: 18px; text-align: center; flex-shrink: 0; }
  .sidebar-divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* ── Middle Panel ── */
  .middle-panel {
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Chart + Overview container */
  .chart-overview-container {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
    align-items: start;
  }

  .chart-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chart-wrap { position: relative; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
  canvas#pieChart { display: block; cursor: default; }
  .chart-center-label { position: absolute; text-align: center; pointer-events: none; }
  .cl-num {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--text-head);
    line-height: 1;
  }
  .cl-sub { font-size: 0.6rem; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.14em; margin-top: 3px; }
  .legend { display: flex; flex-direction: column; gap: 3px; margin-top: 10px; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    transition: background 0.12s;
    font-size: 0.76rem;
  }
  .legend-item:hover { background: var(--hover-bg); }
  .legend-dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
  .legend-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .legend-weight { color: var(--text-faint); font-size: 0.7rem; }

  .overview-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px;
    transition: all 0.15s;
    cursor: pointer;
  }
  .stat-box:hover { border-color: var(--accent); }
  .stat-val {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--accent);
    line-height: 1;
  }
  .stat-label { font-size: 0.65rem; font-weight: 600; color: var(--text-faint); margin-top: 5px; text-transform: uppercase; letter-spacing: 0.1em; }

  /* Details card (due soon/overdue) */
  .details-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .details-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .details-title { font-family: 'Inter', sans-serif; font-size: 0.92rem; font-weight: 600; color: var(--text-head); }
  .details-count { font-size: 0.72rem; font-weight: 600; color: var(--text-faint); background: var(--surface); padding: 3px 9px; border-radius: 5px; }
  .details-list { display: flex; flex-direction: column; gap: 8px; }
  .detail-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 13px;
    background: var(--surface);
    transition: all 0.15s;
  }
  .detail-item:hover { border-color: var(--accent); box-shadow: 0 2px 8px var(--shadow); }
  .detail-item.overdue { border-left: 2px solid var(--dl-over); }
  .di-name { font-weight: 600; font-size: 0.87rem; color: var(--text-head); margin-bottom: 4px; }
  .di-meta { display: flex; gap: 8px; font-size: 0.7rem; color: var(--text-faint); }
  .di-tag { background: var(--sub-bg); padding: 2px 7px; border-radius: 4px; color: var(--dl-fut); }
  .di-tag.overdue-tag { background: var(--dl-over-bg); color: var(--dl-over); }

  /* ── Right Panel: Projects ── */
  .projects-panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 24px 18px;
    transition: background 0.25s;
  }
  .panel-header { margin-bottom: 18px; }
  .panel-label { font-size: 0.68rem; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 5px; }
  .panel-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text-head);
    line-height: 1.2;
  }

  /* ── Task list ── */
  .task-list { display: flex; flex-direction: column; gap: 7px; }
  .task-node {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface2);
    overflow: hidden;
    transition: all 0.15s;
  }
  .task-node:hover { border-color: var(--border2); box-shadow: 0 2px 8px var(--shadow); }
  .task-node.overdue { border-left: 2px solid var(--dl-over); }
  .task-row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; }
  .task-swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .task-info { flex: 1; min-width: 0; }
  .task-name {
    font-weight: 500;
    font-size: 0.88rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    color: var(--text-head);
    transition: color 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .task-name:hover { color: var(--accent); }
  .drill-icon { font-size: 0.5rem; color: var(--text-dim); opacity: 0; transition: opacity 0.15s, transform 0.15s; }
  .task-name:hover .drill-icon { opacity: 1; transform: translateX(2px); }
  .task-meta { display: flex; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 0.68rem;
    font-weight: 500;
  }
  .tag-deadline { background: var(--sub-bg); color: var(--dl-fut); }
  .tag-soon { background: var(--dl-soon-bg); color: var(--dl-soon); }
  .tag-overdue { background: var(--dl-over-bg); color: var(--dl-over); }
  .tag-weight { color: var(--text-faint); background: transparent; font-weight: 400; }
  .tag-children { color: var(--text-dim); background: transparent; font-weight: 400; }
  .task-actions { display: flex; gap: 3px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
  .task-row:hover .task-actions { opacity: 1; }
  .weight-bar-wrap { height: 1.5px; background: var(--border); }
  .weight-bar { height: 100%; transition: width 0.4s ease; opacity: 0.7; }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .empty-state .big { font-size: 2rem; margin-bottom: 10px; opacity: 0.6; }
  .empty-state p { font-size: 0.82rem; line-height: 1.8; color: var(--text-faint); }
  .empty-state strong { color: var(--accent); font-weight: 500; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 7px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  [data-theme="dark"] .btn-primary { color: #0d1117; }
  .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--text-muted); }
  .btn-ghost:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }
  .btn-sm { padding: 3px 9px; font-size: 0.72rem; }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 14px;
    padding: 26px;
    width: 410px;
    max-width: 95vw;
    box-shadow: 0 24px 64px var(--shadow);
    animation: slideUp 0.18s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(12px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--text-head);
  }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 0.69rem; font-weight: 600; color: var(--text-faint); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.12em; }
  .field input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,0.12); }
  [data-theme="light"] .field input:focus { box-shadow: 0 0 0 3px rgba(9,105,218,0.12); }
  .field input::placeholder { color: var(--text-dim); }
  .field input[type="range"] { padding: 4px 0; accent-color: var(--accent); cursor: pointer; border: none; background: transparent; }
  .range-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .range-hint { font-size: 0.67rem; color: var(--text-dim); }
  .range-val { font-size: 0.82rem; font-weight: 600; color: var(--accent); }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; }

  .chart-tooltip {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 9px 13px;
    font-size: 0.73rem;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    white-space: nowrap;
    z-index: 10;
    box-shadow: 0 6px 20px var(--shadow);
  }
  .chart-tooltip.visible { opacity: 1; }
  .tt-name { font-weight: 600; font-size: 0.8rem; color: var(--text-head); }
  .tt-sub { color: var(--text-muted); margin-top: 2px; font-size: 0.72rem; }
  .tt-hint { color: var(--accent); margin-top: 5px; font-size: 0.67rem; font-weight: 500; }

  .section-label {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: 10px;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  /* ── Overlay for mobile sidebar ── */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 89;
  }
  .sidebar-overlay.open { display: block; }

  /* ── Mobile ── */
  @media (max-width: 1200px) {
    .main { grid-template-columns: 260px 1fr; }
    .projects-panel { display: none; }
    .chart-overview-container { grid-template-columns: 1fr; }
  }

  @media (max-width: 768px) {
    .hamburger { display: flex; }
    .topbar-brand { font-size: 0.95rem; }
    .main { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed;
      left: 0;
      top: 54px;
      bottom: 0;
      width: 280px;
      z-index: 90;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .projects-panel { display: block; border-left: none; border-top: 1px solid var(--border); }
    .chart-overview-container { grid-template-columns: 1fr; }
    canvas#pieChart { width: 200px !important; height: 200px !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="hamburger" id="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="topbar-brand">Dashboard</div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="themeToggle" onclick="toggleTheme()">🌙</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add</button>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="main">
  <!-- Left Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Navigate</div>
      <div class="sidebar-item active" onclick="navigateToIndex(-1); closeSidebar()">
        <span class="sidebar-icon">🏠</span>
        <span>Home</span>
      </div>
      <div id="navBreadcrumb"></div>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section">
      <div class="sidebar-title">Analytics</div>
      <div class="sidebar-item" onclick="showAnalytics('completion'); closeSidebar()">
        <span class="sidebar-icon">✓</span>
        <span>Completion Rate</span>
      </div>
      <div class="sidebar-item" onclick="showAnalytics('burndown'); closeSidebar()">
        <span class="sidebar-icon">📉</span>
        <span>Burndown Chart</span>
      </div>
      <div class="sidebar-item" onclick="showAnalytics('ontime'); closeSidebar()">
        <span class="sidebar-icon">⏰</span>
        <span>On-Time %</span>
      </div>
      <div class="sidebar-item" onclick="showAnalytics('heatmap'); closeSidebar()">
        <span class="sidebar-icon">🔥</span>
        <span>Heatmap</span>
      </div>
      <div class="sidebar-item" onclick="showAnalytics('trends'); closeSidebar()">
        <span class="sidebar-icon">📈</span>
        <span>Trends</span>
      </div>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section">
      <div class="sidebar-title">Tools</div>
      <div class="sidebar-item" onclick="exportTaskData(); closeSidebar()">
        <span class="sidebar-icon">⬇</span>
        <span>Export Data</span>
      </div>
      <div class="sidebar-item" onclick="importTaskData(); closeSidebar()">
        <span class="sidebar-icon">⬆</span>
        <span>Import Data</span>
      </div>
    </div>
  </div>

  <!-- Middle Panel -->
  <div class="middle-panel">
    <!-- Chart + Overview Container -->
    <div class="chart-overview-container">
      <!-- Chart Section -->
      <div class="chart-section">
        <div class="section-label">Weight Distribution</div>
        <div class="chart-wrap" id="chartWrap">
          <canvas id="pieChart" width="240" height="240"></canvas>
          <div class="chart-center-label">
            <div class="cl-num" id="centerNum">0</div>
            <div class="cl-sub" id="centerSub">projects</div>
          </div>
          <div class="chart-tooltip" id="chartTooltip"></div>
        </div>
        <div class="legend" id="chartLegend"></div>
      </div>

      <!-- Overview Section -->
      <div class="overview-section">
        <div class="section-label">Overview</div>
        <div class="stats-grid" id="statsGrid"></div>
      </div>
    </div>

    <!-- Details Card (Due Soon / Overdue) -->
    <div id="detailsCard"></div>
  </div>

  <!-- Right Panel: Projects -->
  <div class="projects-panel">
    <div class="panel-header">
      <div class="panel-label">Current Level</div>
      <div class="panel-title" id="panelTitle">Projects</div>
    </div>
    <div class="task-list" id="taskList"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">New Project</div>
    <div class="field">
      <label>Name</label>
      <input type="text" id="fName" placeholder="e.g. Redesign the landing page" />
    </div>
    <div class="field">
      <label>Deadline</label>
      <input type="date" id="fDeadline" />
    </div>
    <div class="field">
      <label>Weightage</label>
      <input type="range" id="fWeight" min="1" max="100" value="50"
             oninput="document.getElementById('weightVal').textContent=this.value" />
      <div class="range-row">
        <span class="range-hint">1 — 100</span>
        <span class="range-val" id="weightVal">50</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()">Save</button>
    </div>
  </div>
</div>

<script>
// ─── Theme ────────────────────────────────────────────────────────────────────
const THEME_KEY = 'tasktree_theme';
let currentTheme = localStorage.getItem(THEME_KEY) || 'dark';

function applyTheme(t) {
  currentTheme = t;
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeToggle').textContent = t === 'dark' ? '🌙' : '☀️';
  localStorage.setItem(THEME_KEY, t);
  if (typeof segments !== 'undefined') renderChart();
}
function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

// ─── Sidebar ──────────────────────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// ─── Storage ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'tasktree_v3';
function loadData() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

// ─── State ────────────────────────────────────────────────────────────────────
let tasks = loadData();
let viewStack = [];
let editingId = null;
let detailsMode = 'soon';

// ─── Colors ───────────────────────────────────────────────────────────────────
const DARK_COLORS  = ['#58a6ff','#3fb950','#f78166','#ffa657','#bc8cff','#79c0ff','#56d364','#ff7b72','#d2a8ff','#7ee787','#ffb77c','#a5d6ff'];
const LIGHT_COLORS = ['#0969da','#1a7f37','#cf222e','#9a6700','#8250df','#0550ae','#116329','#a40e26','#6639ba','#1d7b3c','#7d4e00','#033d8b'];
const getColor = i => (currentTheme === 'dark' ? DARK_COLORS : LIGHT_COLORS)[i % 12];

// ─── Helpers ──────────────────────────────────────────────────────────────────
function findTask(id, list = tasks) {
  for (const t of list) {
    if (t.id === id) return t;
    const f = findTask(id, t.children || []);
    if (f) return f;
  }
  return null;
}
function deleteTask(id, list = tasks) {
  const i = list.findIndex(t => t.id === id);
  if (i !== -1) { list.splice(i, 1); return true; }
  for (const t of list) if (deleteTask(id, t.children || [])) return true;
  return false;
}
function countDescendants(t) { return (t.children||[]).reduce((s,c)=>s+1+countDescendants(c),0); }
function getCurrentList() {
  if (!viewStack.length) return tasks;
  const t = findTask(viewStack[viewStack.length-1]);
  return t ? (t.children||[]) : tasks;
}
function getCurrentTask() { return viewStack.length ? findTask(viewStack[viewStack.length-1]) : null; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function isOverdue(t) { return t.deadline && new Date(t.deadline) < new Date(new Date().toDateString()); }
function formatDate(d) { return d ? new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}) : '—'; }
function daysLeft(d) { return d ? Math.ceil((new Date(d)-new Date(new Date().toDateString()))/86400000) : null; }

// ─── Navigation ───────────────────────────────────────────────────────────────
function navigateTo(id) { viewStack.push(id); render(); }
function navigateToIndex(i) { viewStack = i < 0 ? [] : viewStack.slice(0, i+1); render(); }

// ─── Sidebar Breadcrumb ───────────────────────────────────────────────────────
function renderSidebarNav() {
  const bc = document.getElementById('navBreadcrumb');
  if (!viewStack.length) { bc.innerHTML = ''; return; }
  let html = '';
  viewStack.forEach((id, i) => {
    const t = findTask(id);
    const name = t?.name || '…';
    const isActive = i === viewStack.length - 1;
    html += `<div class="sidebar-item ${isActive?'active':''}" onclick="navigateToIndex(${i}); closeSidebar()">
      <span class="sidebar-icon">${isActive?'▸':'°'}</span>
      <span>${name}</span>
    </div>`;
  });
  bc.innerHTML = html;
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = !viewStack.length ? 'New Project' : 'New Task';
  document.getElementById('fName').value = '';
  document.getElementById('fDeadline').value = '';
  document.getElementById('fWeight').value = 50;
  document.getElementById('weightVal').textContent = '50';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('fName').focus(), 80);
}
function openEditModal(id) {
  const t = findTask(id);
  if (!t) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit';
  document.getElementById('fName').value = t.name;
  document.getElementById('fDeadline').value = t.deadline||'';
  document.getElementById('fWeight').value = t.weightage;
  document.getElementById('weightVal').textContent = t.weightage;
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('fName').focus(), 80);
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId=null; }
function saveTask() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { document.getElementById('fName').focus(); return; }
  const deadline  = document.getElementById('fDeadline').value || null;
  const weightage = parseInt(document.getElementById('fWeight').value, 10);
  if (editingId) {
    const t = findTask(editingId);
    if (t) Object.assign(t, {name, deadline, weightage});
  } else {
    getCurrentList().push({id:uid(), name, deadline, weightage, children:[]});
  }
  saveData(tasks);
  closeModal();
  render();
}
document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

// ─── Delete ───────────────────────────────────────────────────────────────────
function confirmDelete(id) {
  const t = findTask(id);
  if (!t) return;
  const n = countDescendants(t);
  if (!confirm(n > 0 ? `Delete "${t.name}" and its ${n} subtask(s)?` : `Delete "${t.name}"?`)) return;
  if (viewStack.includes(id)) viewStack = viewStack.slice(0, viewStack.indexOf(id));
  deleteTask(id);
  saveData(tasks);
  render();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  renderPanelTitle();
  renderTasks();
  renderChart();
  renderStats();
  renderSidebarNav();
}

function renderPanelTitle() {
  const title = document.getElementById('panelTitle');
  if (!viewStack.length) {
    title.textContent = 'Projects';
  } else {
    const ct = getCurrentTask();
    title.textContent = ct?.name || '';
  }
}

function renderTasks() {
  const list = document.getElementById('taskList');
  const items = getCurrentList();
  const home = !viewStack.length;
  if (!items.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="big">${home ? '◎' : '○'}</div>
      <p>No ${home?'projects':'tasks'} here yet.<br>Click <strong>+ Add</strong> to get started.</p>
    </div>`;
    return;
  }
  const total = items.reduce((s,t)=>s+(t.weightage||0),0);
  list.innerHTML = '';
  items.forEach((task,i)=>list.appendChild(buildTaskEl(task,i,total)));
}

function buildTaskEl(task, colorIdx, totalWeight) {
  const el = document.createElement('div');
  const color = getColor(colorIdx);
  const overdue = isOverdue(task);
  const dl = daysLeft(task.deadline);
  const pct = totalWeight > 0 ? ((task.weightage/totalWeight)*100).toFixed(1) : 0;
  const cc = (task.children||[]).length;
  el.className = `task-node${overdue?' overdue':''}`;
  el.dataset.id = task.id;

  let deadlineTag = '';
  if (task.deadline) {
    if (overdue)    deadlineTag = `<span class="tag tag-overdue">Overdue</span>`;
    else if(dl===0) deadlineTag = `<span class="tag tag-overdue">Today</span>`;
    else if(dl<=3)  deadlineTag = `<span class="tag tag-soon">${dl}d left</span>`;
    else            deadlineTag = `<span class="tag tag-deadline">${formatDate(task.deadline)}</span>`;
  }

  el.innerHTML = `
    <div class="task-row">
      <div class="task-swatch" style="background:${color}"></div>
      <div class="task-info">
        <div class="task-name" onclick="navigateTo('${task.id}')">
          ${task.name} <span class="drill-icon">▶</span>
        </div>
        <div class="task-meta">
          ${deadlineTag}
          <span class="tag tag-weight">${task.weightage} · ${pct}%</span>
          ${cc ? `<span class="tag tag-children">${cc} subtask${cc>1?'s':''}</span>` : ''}
        </div>
      </div>
      <div class="task-actions" onclick="event.stopPropagation()">
        <button class="btn btn-sm btn-ghost" onclick="openEditModal('${task.id}')" title="Edit">✎</button>
        <button class="btn btn-sm btn-ghost" onclick="confirmDelete('${task.id}')" title="Delete">✕</button>
      </div>
    </div>
    <div class="weight-bar-wrap">
      <div class="weight-bar" style="width:${pct}%;background:${color}"></div>
    </div>`;
  return el;
}

// ─── Chart ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('pieChart');
const ctx2d = canvas.getContext('2d');
const tooltip = document.getElementById('chartTooltip');
let segments = [];

function getCSSVar(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function renderChart() {
  const items = getCurrentList();
  const total = items.reduce((s,t)=>s+(t.weightage||0),0);
  const W = canvas.width, H = canvas.height;
  ctx2d.clearRect(0,0,W,H);
  segments = [];
  document.getElementById('centerNum').textContent = items.length;
  document.getElementById('centerSub').textContent = !viewStack.length ? 'projects' : 'tasks';
  document.getElementById('chartLegend').innerHTML = '';

  if (!items.length || total===0) {
    ctx2d.beginPath();
    ctx2d.arc(W/2,H/2,W*0.37,0,Math.PI*2);
    ctx2d.strokeStyle = getCSSVar('--border2');
    ctx2d.lineWidth = 22;
    ctx2d.stroke();
    return;
  }

  const cx=W/2, cy=H/2, outerR=W*0.42, innerR=W*0.27, GAP=0.014;
  let angle = -Math.PI/2;

  items.forEach((task,i)=>{
    const frac = task.weightage/total;
    const sweep = frac*Math.PI*2;
    const color = getColor(i);
    const sa=angle+GAP/2, ea=angle+sweep-GAP/2;

    ctx2d.beginPath();
    ctx2d.moveTo(cx+innerR*Math.cos(sa), cy+innerR*Math.sin(sa));
    ctx2d.arc(cx,cy,outerR,sa,ea);
    ctx2d.arc(cx,cy,innerR,ea,sa,true);
    ctx2d.closePath();
    ctx2d.fillStyle = color;
    ctx2d.fill();

    segments.push({id:task.id, name:task.name, color, frac, weightage:task.weightage, startAngle:sa, endAngle:ea});
    angle += sweep;

    const li = document.createElement('div');
    li.className = 'legend-item';
    li.innerHTML = `<div class="legend-dot" style="background:${color}"></div><span class="legend-name">${task.name}</span><span class="legend-weight">${task.weightage} · ${(frac*100).toFixed(1)}%</span>`;
    li.addEventListener('click', ()=>navigateTo(task.id));
    document.getElementById('chartLegend').appendChild(li);
  });
}

function hitTest(mx,my) {
  const rect=canvas.getBoundingClientRect();
  const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
  const x=(mx-rect.left)*sx, y=(my-rect.top)*sy;
  const cx=canvas.width/2, cy=canvas.height/2;
  const dx=x-cx, dy=y-cy, dist=Math.hypot(dx,dy);
  const outerR=canvas.width*0.42, innerR=canvas.width*0.27;
  if (dist<innerR||dist>outerR) return -1;
  const base=-Math.PI/2;
  let a=Math.atan2(dy,dx);
  while(a<base) a+=Math.PI*2;
  while(a>base+Math.PI*2) a-=Math.PI*2;
  for(let i=0;i<segments.length;i++){
    let s=segments[i].startAngle, e=segments[i].endAngle;
    while(s<base) s+=Math.PI*2; while(s>base+Math.PI*2) s-=Math.PI*2;
    while(e<s) e+=Math.PI*2;
    if(a>=s&&a<=e) return i;
  }
  return -1;
}

canvas.addEventListener('mousemove', e=>{
  const idx=hitTest(e.clientX,e.clientY);
  if(idx===-1){tooltip.classList.remove('visible');canvas.style.cursor='default';return;}
  const seg=segments[idx];
  canvas.style.cursor='pointer';
  tooltip.innerHTML=`<div class="tt-name">${seg.name}</div><div class="tt-sub">${seg.weightage} · ${(seg.frac*100).toFixed(1)}%</div><div class="tt-hint">Click to open →</div>`;
  tooltip.classList.add('visible');
  const wrap=document.getElementById('chartWrap').getBoundingClientRect();
  let tx=e.clientX-wrap.left+14, ty=e.clientY-wrap.top-10;
  if(tx+180>wrap.width) tx=e.clientX-wrap.left-185;
  tooltip.style.left=tx+'px'; tooltip.style.top=ty+'px';
});
canvas.addEventListener('mouseleave',()=>{tooltip.classList.remove('visible');canvas.style.cursor='default';});
canvas.addEventListener('click',e=>{
  const idx=hitTest(e.clientX,e.clientY);
  if(idx!==-1){tooltip.classList.remove('visible');navigateTo(segments[idx].id);}
});

// ─── Stats & Details ──────────────────────────────────────────────────────────
function countAll(l=tasks){return l.reduce((s,t)=>s+1+countAll(t.children||[]),0);}
function countOverdue(l=tasks){return l.reduce((s,t)=>s+(isOverdue(t)?1:0)+countOverdue(t.children||[]),0);}
function countSoon(l=tasks){return l.reduce((s,t)=>{const d=daysLeft(t.deadline);return s+(d!==null&&d>=0&&d<=7?1:0)+countSoon(t.children||[]);},0);}
function getTasksFromList(l=tasks) {
  let all = [];
  for (const t of l) {
    all.push(t);
    all = all.concat(getTasksFromList(t.children || []));
  }
  return all;
}

function renderStats() {
  const ov=countOverdue(), sn=countSoon();
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-box" onclick="showDetails('soon')"><div class="stat-val">${countAll()}</div><div class="stat-label">Total</div></div>
    <div class="stat-box" onclick="showDetails('soon')"><div class="stat-val">${getCurrentList().length}</div><div class="stat-label">This level</div></div>
    <div class="stat-box" onclick="showDetails('overdue')"><div class="stat-val" style="color:${ov?'var(--dl-over)':'var(--text-dim)'}">${ov}</div><div class="stat-label">Overdue</div></div>
    <div class="stat-box" onclick="showDetails('soon')"><div class="stat-val" style="${sn?'color:var(--dl-soon)':'color:var(--text-dim)'}">${sn}</div><div class="stat-label">Due soon</div></div>`;
  renderDetails();
}

function showDetails(mode) {
  detailsMode = mode;
  renderDetails();
}

function renderDetails() {
  const container = document.getElementById('detailsCard');
  const allTasks = getTasksFromList();
  let filtered = [];

  if (detailsMode === 'overdue') {
    filtered = allTasks.filter(t => isOverdue(t));
  } else {
    filtered = allTasks.filter(t => {
      const dl = daysLeft(t.deadline);
      return dl !== null && dl >= 0 && dl <= 7;
    });
  }

  if (!filtered.length) {
    container.innerHTML = '';
    return;
  }

  const title = detailsMode === 'overdue' ? 'Overdue Tasks' : 'Due This Week';
  let html = `
    <div class="details-card">
      <div class="details-header">
        <div class="details-title">${title}</div>
        <div class="details-count">${filtered.length} task${filtered.length>1?'s':''}</div>
      </div>
      <div class="details-list">`;

  filtered.forEach(task => {
    const isOd = isOverdue(task);
    const dl = daysLeft(task.deadline);
    const dlStr = isOd ? `${Math.abs(dl)} day${Math.abs(dl)>1?'s':''} overdue` : dl === 0 ? 'Today' : `In ${dl} day${dl>1?'s':''}`;
    html += `
      <div class="detail-item ${isOd?'overdue':''}">
        <div class="di-name">${task.name}</div>
        <div class="di-meta">
          <span class="di-tag ${isOd?'overdue-tag':''}">📅 ${dlStr}</span>
          <span style="color:var(--text-faint)">⚖ ${task.weightage}</span>
        </div>
      </div>`;
  });

  html += `</div></div>`;
  container.innerHTML = html;
}

// ─── Analytics Stub ───────────────────────────────────────────────────────────
function showAnalytics(type) {
  alert(`Analytics: ${type}\n\nComing soon — placeholder for ${type} view.`);
}

// ─── Export/Import ────────────────────────────────────────────────────────────
function exportTaskData() {
  const data = JSON.stringify(tasks, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tasks-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importTaskData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (Array.isArray(imported)) {
          tasks = imported;
          saveData(tasks);
          viewStack = [];
          render();
          alert('Tasks imported successfully!');
        } else throw new Error('Invalid format');
      } catch (err) {
        alert('Error importing: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ─── Keyboard ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  const open=document.getElementById('modalOverlay').classList.contains('open');
  if(e.key==='Escape'){open?closeModal():(viewStack.length?navigateToIndex(viewStack.length-2):closeSidebar());}
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter') saveTask();
  if(e.key==='n'&&!open){e.preventDefault();openAddModal();}
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
applyTheme(currentTheme);
render();
</script>
</body>
</html>
